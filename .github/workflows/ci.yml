name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Node 24 is the calibration-authority runtime: every committed seed-42
      # baseline in the v169->v271 lineage was baked on it. The recorded
      # differential (green on Node 24; deterministic duftite 8->9 /
      # erythrite 5->4 count flips on Node 20/22/23, measured at v237) lives
      # in BUG-supergene-calibration-v237.md. Do not pin another major here,
      # and do not add any bake/regenerate step: this workflow VALIDATES the
      # committed science, it never redefines it.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Runtime provenance
        run: |
          node --version
          npm --version
          uname -a

      - run: npm ci

      - run: npm run typecheck

      # Real build first (dist/ is gitignored and the test harness evals the
      # built bundle), then the generated-artifact drift check.
      - run: npm run build
      - run: npm run build:check

      # Science validation against COMMITTED receipts and manifests —
      # check-only, no bake. Content hashing is LF-normalised
      # (tools/hash-policy.mjs, policy v1) and the first ubuntu run of this
      # workflow verified it: ZERO content violations on a linux checkout.
      #
      # audit:science, audit:evidence and audit:release are NOT run here,
      # with regret: their aggregate receipts bind node_runtime_sha256
      # (platform/Node/V8/ICU of the baking host, win32/Node 24), so on any
      # other host they fail no matter how current the content is. Measured,
      # not assumed: audit:science → "Node/V8 runtime mismatch", the ONLY
      # violation on run 32274501930; audit:release → "manifest missing or
      # stale" on run 32280067117, because catalog_sha256 folds the runtime
      # fingerprint. All three stay in `npm run ci` (the canonical box's
      # cold CI). Restore them here the moment the recorded-environment
      # check is split from the content-currency check (the carried debt in
      # proposals/BACKLOG.md, Codex-integration entry, item c) — that split
      # edits a digest-pinned producer, so it must ride a bake.
      - run: npm run audit:localities
      - run: npm run audit:scenarios
      - run: npm run audit:narratives
      - run: npm run audit:tutorials
      - run: npm run audit:a11y
      - run: npm run audit:creative
      - run: npm run audit:bif
      # audit:cations is deliberately ABSENT: SCHNEEBERG_SEED42_COMMISSIONING
      # pins SIM 267 and re-commissioning at SIM 271 is an open maintainer
      # decision (measured RED on 2026-08-19: "seed 42 has no commissioning
      # checkpoint for SIM 271"). Restore it the moment that checkpoint is
      # re-commissioned.

      # The calibration sentinel does NOT run here, and the reason is the
      # strongest one available: it CANNOT. The baseline loads through the
      # authenticated-evidence chain, and that chain fails closed on any
      # host whose runtime envelope (platform/Node/V8/ICU) is not the one
      # the receipts record — measured on run 32283445918: "science evidence
      # receipt does not match the current Node runtime envelope", thrown at
      # loadReceipt before a single scenario ran. That refusal is the
      # loader working as designed, refusing foreign-host evidence; do not
      # weaken it to buy a green badge. The sentinel is a canonical-box
      # check until the recorded-environment half of the receipt splits
      # from the content-currency half (BACKLOG debt item c): run it there
      # with `npx vitest run tests-js/calibration-shard -t
      # "supergene_oxidation matches baseline"` (~220 s; green twice on
      # 2026-08-19 at SIM 271). The full 232-file suite likewise belongs to
      # the foreman-controlled local workflow, never a shared runner.

      # agent-api surface (PR #7): the lockfile install must succeed without
      # rewriting the lockfile, and the CLI must answer.
      - run: npm ci --prefix agent-api
      - name: agent-api help smoke
        run: |
          printf '{"cmd":"help"}\n' | node agent-api/vugg-agent.js | grep -q '"ok":true'
          git diff --exit-code agent-api/package-lock.json
